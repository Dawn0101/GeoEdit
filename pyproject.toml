[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geoedit"
version = "0.2.0"
description = "One-step text-guided editing on SD-Turbo: halo (P1) and how-far/Picard (P2) tests"
requires-python = ">=3.10"

# 扁平布局：包在仓库根目录（src/ 布局是 v1 的，已随分支切走）
[tool.setuptools]
packages = ["geoedit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
